# Site: http://localhost:8080
# Postgres no host: localhost:5432  usuário/senha/banco: mpen

services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://mpen:mpen@db:5432/mpen
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "8080"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mpen
      POSTGRES_PASSWORD: mpen
      POSTGRES_DB: mpen
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpen -d mpen"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  web_node_modules:
  web_next:
